<div class="flex flex-col w-full h-full items-center justify-center gap-6 p-6">
  <h1 class="text-2xl font-bold">User Dashboard</h1>

  <!-- ACTION BUTTONS -->
  <div class="flex gap-3">
    <p-button fluid label="Fetch User Books" (onClick)="fetchUserBooks()" />
    <p-button fluid label="Fetch Admin Books" (onClick)="fetchAdminBooks()" />
    <p-button fluid label="Logout" (onClick)="logout()" severity="danger" />
  </div>

  <!-- RESPONSE DISPLAY -->
  <p-card header="API Response" fluid>
    <div class="flex flex-col gap-2">
      <div class="flex items-center gap-2">
        <span class="font-semibold">HTTP Status:</span>
        <span
          [ngClass]="{
            'text-green-600':
              responseStatus !== null && responseStatus >= 200 && responseStatus < 300,
            'text-red-600': responseStatus !== null && responseStatus >= 400,
          }"
        >
          {{ responseStatus ?? 'No request made' }}
        </span>
      </div>

      <div>
        <span class="font-semibold">Response Body:</span>
        <pre class="bg-zinc-800 p-3 rounded-md overflow-auto max-h-60"
          >{{ responseBody | json }}
        </pre>
      </div>
    </div>
  </p-card>
</div>
